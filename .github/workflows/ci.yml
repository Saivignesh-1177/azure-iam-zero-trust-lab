name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege for the pipeline itself (OWASP CICD-SEC-2/5). No Azure access in CI at all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep:
    name: Bicep build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and lint (bicepconfig.json makes security rules errors)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile compiled/main.json
          az bicep build --file infra/activity-log.bicep --outfile compiled/activity-log.json
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/activity-log.bicep
      - uses: actions/upload-artifact@v7
        with:
          name: compiled-arm
          path: compiled/

  tests:
    name: Design + traceability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: az bicep install
      - run: pytest -v

  checkov:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    needs: bicep
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab (free for public repos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: compiled-arm
          path: compiled/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Scan compiled ARM (skips are justified in .checkov.yaml)
        run: checkov -d compiled --config-file .checkov.yaml -o cli -o sarif --output-file-path console,results
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results          # directory: works whatever checkov names the file
          category: checkov

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # scan full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
